<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2185b"/></marker>
    <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f28c00"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <g stroke="#ddd" stroke-width="1"><line x1="400" y1="20" x2="400" y2="400"/><line x1="800" y1="20" x2="800" y2="400"/></g>

  <!-- ================= 1: before contact ================= -->
  <g transform="translate(20,0)">
    <text x="180" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">1  Before contact</text>
    <!-- chains: A above B, straight, separated by d -->
    <line x1="20" y1="190" x2="340" y2="190" stroke="#1f6fd1" stroke-width="4"/>
    <line x1="20" y1="260" x2="340" y2="260" stroke="#c2185b" stroke-width="4"/>
    <circle cx="20" cy="190" r="7" fill="#1f6fd1"/><circle cx="340" cy="190" r="7" fill="#1f6fd1"/>
    <circle cx="20" cy="260" r="7" fill="#c2185b"/><circle cx="340" cy="260" r="7" fill="#c2185b"/>
    <text x="30" y="178" font-size="16" font-weight="bold" fill="#1f6fd1">chain A</text>
    <text x="30" y="286" font-size="16" font-weight="bold" fill="#c2185b">chain B</text>
    <!-- closest points joined by a dotted line (d < PROXIMITY_DISTANCE) -->
    <circle cx="180" cy="190" r="3" fill="#555"/><circle cx="180" cy="260" r="3" fill="#555"/>
    <line x1="180" y1="194" x2="180" y2="256" stroke="#111" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round"/>
    <text x="192" y="231" font-size="17" font-style="italic" fill="#111">d</text>
    <!-- the user drags the ends towards each other -->
    <line x1="20" y1="140" x2="20" y2="172" stroke="#888" stroke-width="3" marker-end="url(#aG)"/>
    <line x1="340" y1="140" x2="340" y2="172" stroke="#888" stroke-width="3" marker-end="url(#aG)"/>
    <line x1="20" y1="310" x2="20" y2="278" stroke="#888" stroke-width="3" marker-end="url(#aG)"/>
    <line x1="340" y1="310" x2="340" y2="278" stroke="#888" stroke-width="3" marker-end="url(#aG)"/>
    <text x="180" y="132" font-size="13" fill="#777" text-anchor="middle">ends dragged towards each other</text>
  </g>

  <!-- ================= 2: contact ================= -->
  <g transform="translate(420,0)">
    <text x="180" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">2  Contact</text>
    <polyline points="20,310 180,175 340,310" fill="none" stroke="#1f6fd1" stroke-width="4" stroke-linejoin="round"/>
    <polyline points="20,140 180,275 340,140" fill="none" stroke="#c2185b" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="20" cy="310" r="7" fill="#1f6fd1"/><circle cx="340" cy="310" r="7" fill="#1f6fd1"/>
    <circle cx="20" cy="140" r="7" fill="#c2185b"/><circle cx="340" cy="140" r="7" fill="#c2185b"/>
    <text x="30" y="336" font-size="16" font-weight="bold" fill="#1f6fd1">chain A</text>
    <text x="30" y="128" font-size="16" font-weight="bold" fill="#c2185b">chain B</text>
    <!-- v between the two nodes, junction in the middle -->
    <circle cx="180" cy="175" r="4" fill="#555"/><circle cx="180" cy="275" r="4" fill="#555"/>
    <line x1="180" y1="180" x2="180" y2="268" stroke="#f28c00" stroke-width="3.5" stroke-dasharray="2 6" stroke-linecap="round" marker-end="url(#aV)"/>
    <circle cx="180" cy="225" r="6" fill="#111"/>
    <text x="172" y="158" font-size="20" font-style="italic" font-weight="bold" fill="#f28c00">v</text>
    <text x="190" y="158" font-size="13" fill="#444">|v| = min_distance</text>
    <!-- each chain pulls its node through the other: FA towards B (+v), FB towards A (-v) -->
    <line x1="158" y1="194" x2="158" y2="252" stroke="#1f6fd1" stroke-width="4" marker-end="url(#aA)"/>
    <line x1="202" y1="256" x2="202" y2="198" stroke="#c2185b" stroke-width="4" marker-end="url(#aB)"/>
    <text x="150" y="228" font-size="20" font-weight="bold" fill="#1f6fd1" text-anchor="end">F<tspan font-size="13" dy="4">A</tspan></text>
    <text x="212" y="206" font-size="20" font-weight="bold" fill="#c2185b">F<tspan font-size="13" dy="4">B</tspan></text>
    <!-- w -->
    <line x1="180" y1="296" x2="180" y2="344" stroke="#111" stroke-width="4" marker-end="url(#aK)"/>
    <text x="192" y="318" font-size="17" font-style="italic" fill="#111">w = ½(F<tspan font-size="11" dy="3">A</tspan><tspan dy="-3"> − F</tspan><tspan font-size="11" dy="3">B</tspan><tspan dy="-3">)</tspan></text>
    <text x="192" y="338" font-size="13" fill="#444">v follows the axis of w</text>
  </g>

  <!-- ================= 3: entanglement destroyed ================= -->
  <g transform="translate(820,0)">
    <text x="180" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">3  Entanglement destroyed</text>
    <line x1="20" y1="175" x2="340" y2="175" stroke="#1f6fd1" stroke-width="4"/>
    <line x1="20" y1="275" x2="340" y2="275" stroke="#c2185b" stroke-width="4"/>
    <circle cx="20" cy="175" r="7" fill="#1f6fd1"/><circle cx="340" cy="175" r="7" fill="#1f6fd1"/>
    <circle cx="20" cy="275" r="7" fill="#c2185b"/><circle cx="340" cy="275" r="7" fill="#c2185b"/>
    <text x="30" y="163" font-size="16" font-weight="bold" fill="#1f6fd1">chain A</text>
    <text x="30" y="301" font-size="16" font-weight="bold" fill="#c2185b">chain B</text>
    <!-- ghosts of the bent chains: the ends were moved back until the chains are straight again -->
    <polyline points="20,310 180,175 340,310" fill="none" stroke="#9db8e0" stroke-width="3" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <polyline points="20,140 180,275 340,140" fill="none" stroke="#e0a0b8" stroke-width="3" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="180" y="82" font-size="13" fill="#777" text-anchor="middle">dashed: the contact shape; ends moved back</text>
    <circle cx="180" cy="225" r="6" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="168" y1="213" x2="192" y2="237" stroke="#999" stroke-width="2"/><line x1="192" y1="213" x2="168" y2="237" stroke="#999" stroke-width="2"/>
    <text x="180" y="352" font-size="15" fill="#777" text-anchor="middle">junction removed:  F<tspan font-size="10" dy="3">A</tspan><tspan dy="-3"> = F</tspan><tspan font-size="10" dy="3">B</tspan><tspan dy="-3"> = 0, w = 0</tspan></text>
  </g>

  <!-- captions -->
  <g font-size="14" fill="#222">
    <text x="40" y="420" font-weight="bold">Before contact</text>
    <text x="40" y="440">The chains are straight, no junction. They are</text>
    <text x="40" y="458">further apart than min_distance; the dotted line</text>
    <text x="40" y="476">joins their closest points while d &lt; PROXIMITY_DISTANCE.</text>

    <text x="440" y="420" font-weight="bold">Contact</text>
    <text x="440" y="440">d &lt; min_distance: a junction forms and the chains</text>
    <text x="440" y="458">are held |v| = min_distance apart. Each pulls its</text>
    <text x="440" y="476">node through the other. v always points from A to B</text>
    <text x="440" y="494">and follows the axis of w = ½(F<tspan font-size="10" dy="3">A</tspan><tspan dy="-3"> − F</tspan><tspan font-size="10" dy="3">B</tspan><tspan dy="-3">).</tspan></text>

    <text x="840" y="420" font-weight="bold">Entanglement destroyed</text>
    <text x="840" y="440">The ends are moved back until both chains are straight</text>
    <text x="840" y="458">again: F<tspan font-size="10" dy="3">A</tspan><tspan dy="-3"> = F</tspan><tspan font-size="10" dy="3">B</tspan><tspan dy="-3"> = 0, so w = 0 and the junction is removed</tspan></text>
    <text x="840" y="476">(or the user removes it with x). A new junction needs</text>
    <text x="840" y="494">d &gt; min_distance first.</text>
  </g>
  <g font-size="13" fill="#555">
    <text x="40" y="530">v: from the node of chain A to the node of chain B (orange). F<tspan font-size="9" dy="3">A</tspan><tspan dy="-3">, F</tspan><tspan font-size="9" dy="3">B</tspan><tspan dy="-3">: net spring forces of A, B on the junction. w = ½(F</tspan><tspan font-size="9" dy="3">A</tspan><tspan dy="-3"> − F</tspan><tspan font-size="9" dy="3">B</tspan><tspan dy="-3">). Grey arrows: how the user moves the chain ends.</tspan></text>
  </g>
</svg>
