<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 640" width="1640" height="640" font-family="Helvetica, Arial, sans-serif"><defs><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2185b"/></marker><marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f28c00"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><marker id="aGr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker></defs><rect width="1640" height="640" fill="#fff"/><g stroke="#ddd"><line x1="410" y1="20" x2="410" y2="410"/><line x1="820" y1="20" x2="820" y2="410"/><line x1="1230" y1="20" x2="1230" y2="410"/></g><g transform="translate(20,0)"><text x="180" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">1  Before contact</text><polyline points="20,190 340,190" fill="none" stroke="#1f6fd1" stroke-width="4" stroke-linejoin="round" opacity="1"/><polyline points="20,260 340,260" fill="none" stroke="#c2185b" stroke-width="4" stroke-linejoin="round" opacity="1"/><circle cx="20" cy="190" r="7" fill="#1f6fd1"/><circle cx="340" cy="190" r="7" fill="#1f6fd1"/><circle cx="20" cy="260" r="7" fill="#c2185b"/><circle cx="340" cy="260" r="7" fill="#c2185b"/><text x="30" y="178" font-size="16" font-weight="bold" fill="#1f6fd1">chain A (grabbed)</text><text x="30" y="286" font-size="16" font-weight="bold" fill="#c2185b">chain B</text><circle cx="180" cy="190" r="3" fill="#555"/><circle cx="180" cy="260" r="3" fill="#555"/><line x1="180" y1="194" x2="180" y2="256" stroke="#111" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round"/><text x="192" y="231" font-size="17" font-style="italic" fill="#111">d</text><line x1="20" y1="140" x2="20" y2="172" stroke="#888" stroke-width="3" marker-end="url(#aG)"/><line x1="340" y1="140" x2="340" y2="172" stroke="#888" stroke-width="3" marker-end="url(#aG)"/><text x="180" y="132" font-size="13" fill="#777" text-anchor="middle">user drags the ends of A towards B</text></g><g transform="translate(430,0)"><text x="180" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">2  Contact</text><polyline points="20,310 180,175 340,310" fill="none" stroke="#1f6fd1" stroke-width="4" stroke-linejoin="round" opacity="1"/><polyline points="20,140 180,275 340,140" fill="none" stroke="#c2185b" stroke-width="4" stroke-linejoin="round" opacity="1"/><circle cx="20" cy="310" r="7" fill="#1f6fd1"/><circle cx="340" cy="310" r="7" fill="#1f6fd1"/><circle cx="20" cy="140" r="7" fill="#c2185b"/><circle cx="340" cy="140" r="7" fill="#c2185b"/><text x="30" y="336" font-size="16" font-weight="bold" fill="#1f6fd1">chain A (grabbed)</text><text x="30" y="128" font-size="16" font-weight="bold" fill="#c2185b">chain B</text><line x1="180" y1="177" x2="180" y2="270" stroke="#111" stroke-width="5" marker-end="url(#aV)"/><circle cx="180" cy="175" r="5" fill="#1f6fd1"/><circle cx="180" cy="275" r="5" fill="#c2185b"/><circle cx="180" cy="225" r="6" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="166" y="206" font-size="20" font-style="italic" font-weight="bold" fill="#111" text-anchor="end">v</text><text x="228" y="168" font-size="13" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">node A = P − ½v</text><text x="228" y="288" font-size="13" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">node B = P + ½v</text><text x="196" y="229" font-size="15" font-weight="bold" fill="#111">P</text><line x1="180" y1="175" x2="214" y2="175" stroke="#1f6fd1" stroke-width="1.5"/><line x1="214" y1="175" x2="214" y2="226" stroke="#1f6fd1" stroke-width="4" marker-end="url(#aA)"/><line x1="180" y1="275" x2="146" y2="275" stroke="#c2185b" stroke-width="1.5"/><line x1="146" y1="275" x2="146" y2="224" stroke="#c2185b" stroke-width="4" marker-end="url(#aB)"/><text x="222" y="212" font-size="20" font-weight="bold" fill="#1f6fd1">F<tspan font-size="0.7em" dy="3">A</tspan><tspan dy="-3"></tspan></text><text x="138" y="244" font-size="20" font-weight="bold" fill="#c2185b" text-anchor="end">F<tspan font-size="0.7em" dy="3">B</tspan><tspan dy="-3"></tspan></text><text x="180" y="372" font-size="14" fill="#111" text-anchor="middle">F<tspan font-size="10" dy="3">A</tspan><tspan dy="-3"> ∥ v, F</tspan><tspan font-size="10" dy="3">B</tspan><tspan dy="-3"> ∥ −v:  torque 0, DP &gt; 0 → v black</tspan></text></g><g transform="translate(840,0)"><text x="180" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">3  Rod rotates</text><polyline points="20,310 202,264 340,310" fill="none" stroke="#1f6fd1" stroke-width="4" stroke-linejoin="round" opacity="1"/><polyline points="20,140 158,186 340,140" fill="none" stroke="#c2185b" stroke-width="4" stroke-linejoin="round" opacity="1"/><circle cx="20" cy="310" r="7" fill="#1f6fd1"/><circle cx="340" cy="310" r="7" fill="#1f6fd1"/><circle cx="20" cy="140" r="7" fill="#c2185b"/><circle cx="340" cy="140" r="7" fill="#c2185b"/><text x="30" y="336" font-size="16" font-weight="bold" fill="#1f6fd1">chain A</text><text x="30" y="128" font-size="16" font-weight="bold" fill="#c2185b">chain B</text><line x1="180" y1="225" x2="180" y2="262" stroke="#111" stroke-width="3" stroke-dasharray="6 5" opacity=".0"/><line x1="180" y1="180" x2="180" y2="270" stroke="#111" stroke-width="4" stroke-dasharray="7 6" opacity=".45" marker-end="url(#aV)"/><line x1="204" y1="267" x2="156" y2="183" stroke="#f28c00" stroke-width="5" marker-end="url(#aO)"/><circle cx="202" cy="264" r="5" fill="#1f6fd1"/><circle cx="158" cy="186" r="5" fill="#c2185b"/><circle cx="180" cy="225" r="6" fill="#fff" stroke="#111" stroke-width="2.5"/><line x1="202" y1="264" x2="202" y2="306" stroke="#1f6fd1" stroke-width="4" marker-end="url(#aA)"/><line x1="158" y1="186" x2="158" y2="144" stroke="#c2185b" stroke-width="4" marker-end="url(#aB)"/><text x="212" y="296" font-size="20" font-weight="bold" fill="#1f6fd1">F<tspan font-size="0.7em" dy="3">A</tspan><tspan dy="-3"></tspan></text><text x="148" y="160" font-size="20" font-weight="bold" fill="#c2185b" text-anchor="end">F<tspan font-size="0.7em" dy="3">B</tspan><tspan dy="-3"></tspan></text><path d="M 156,183 A 48 48 0 0 0 156,267" fill="none" stroke="#2e7d32" stroke-width="3.5" marker-end="url(#aGr)" /><text x="122" y="226" font-size="16" font-style="italic" fill="#2e7d32" text-anchor="end">v turns</text><text x="122" y="244" font-size="13" fill="#2e7d32" text-anchor="end">(opposite to T)</text><text x="236" y="236" font-size="14" font-style="italic" fill="#444">w = ½(F<tspan font-size="0.7em" dy="3">A</tspan><tspan dy="-3"></tspan> − F<tspan font-size="0.7em" dy="3">B</tspan><tspan dy="-3">)</tspan></text><text x="236" y="254" font-size="13" fill="#555">dashed: v at rest ∥ w</text><text x="180" y="372" font-size="14" fill="#111" text-anchor="middle">v·w &lt; 0 → DP &lt; 0 → v orange; T = ½ v × (F<tspan font-size="10" dy="3">B</tspan><tspan dy="-3"> − F</tspan><tspan font-size="10" dy="3">A</tspan><tspan dy="-3">) ≠ 0</tspan></text></g><g transform="translate(1250,0)"><text x="180" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">4  Entanglement destroyed</text><polyline points="20,175 340,175" fill="none" stroke="#1f6fd1" stroke-width="4" stroke-linejoin="round" opacity="1"/><polyline points="20,275 340,275" fill="none" stroke="#c2185b" stroke-width="4" stroke-linejoin="round" opacity="1"/><circle cx="20" cy="175" r="7" fill="#1f6fd1"/><circle cx="340" cy="175" r="7" fill="#1f6fd1"/><circle cx="20" cy="275" r="7" fill="#c2185b"/><circle cx="340" cy="275" r="7" fill="#c2185b"/><text x="30" y="163" font-size="16" font-weight="bold" fill="#1f6fd1">chain A</text><text x="30" y="301" font-size="16" font-weight="bold" fill="#c2185b">chain B</text><polyline points="20,310 180,175 340,310" fill="none" stroke="#9db8e0" stroke-width="3" stroke-linejoin="round" stroke-dasharray="6 5" opacity="1"/><polyline points="20,140 180,275 340,140" fill="none" stroke="#e0a0b8" stroke-width="3" stroke-linejoin="round" stroke-dasharray="6 5" opacity="1"/><text x="180" y="82" font-size="13" fill="#777" text-anchor="middle">dashed: the contact shape; ends moved back</text><circle cx="180" cy="225" r="6" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="3 3"/><line x1="168" y1="213" x2="192" y2="237" stroke="#999" stroke-width="2"/><line x1="192" y1="213" x2="168" y2="237" stroke="#999" stroke-width="2"/><text x="180" y="372" font-size="14" fill="#555" text-anchor="middle">junction removed by the user (x)</text></g><g font-size="14" fill="#222"><text x="40" y="440" font-weight="bold">Before contact</text><text x="40" y="460">A is the grabbed strand, B the other. The chains are</text><text x="40" y="478">straight; no junction. The dotted line joins their closest</text><text x="40" y="496">points while d &lt; PROXIMITY_DISTANCE.</text><text x="450" y="440" font-weight="bold">Contact</text><text x="450" y="460">d &lt; min_distance: a junction forms. v is a rigid rod of</text><text x="450" y="478">length min_distance, first from the closest point on A</text><text x="450" y="496">to the closest point on B; P is its centre. A's two</text><text x="450" y="514">segments pull at P − ½v (F<tspan font-size="10" dy="3">A</tspan><tspan dy="-3">), B's at P + ½v (F</tspan><tspan font-size="10" dy="3">B</tspan><tspan dy="-3">).</tspan></text><text x="860" y="440" font-weight="bold">Rod rotates</text><text x="860" y="460">P moves under F<tspan font-size="10" dy="3">A</tspan><tspan dy="-3"> + F</tspan><tspan font-size="10" dy="3">B</tspan><tspan dy="-3"> (black arrow). The rod turns, damped,</tspan></text><text x="860" y="478">opposite to the torque T = (−½v)×F<tspan font-size="10" dy="3">A</tspan><tspan dy="-3"> + (½v)×F</tspan><tspan font-size="10" dy="3">B</tspan><tspan dy="-3">, until</tspan></text><text x="860" y="496">v lies along w. Orange while DP &lt; 0, black when DP ≥ 0.</text><text x="860" y="514">Key v switches the rotation on / off.</text><text x="1270" y="440" font-weight="bold">Entanglement destroyed</text><text x="1270" y="460">The ends are moved back until both chains are</text><text x="1270" y="478">straight again; the user removes the junction with x</text><text x="1270" y="496">(hold the junction, press x). A new junction needs</text><text x="1270" y="514">d &gt; min_distance first.</text></g><g font-size="13" fill="#555"><text x="40" y="600">v: rigid rod from A to B (black if DP = ½ v·(F<tspan font-size="9" dy="3">A</tspan><tspan dy="-3"> − F</tspan><tspan font-size="9" dy="3">B</tspan><tspan dy="-3">) ≥ 0, orange if DP &lt; 0). F</tspan><tspan font-size="9" dy="3">A</tspan><tspan dy="-3">, F</tspan><tspan font-size="9" dy="3">B</tspan><tspan dy="-3">: net spring forces of A and B, drawn at the rod ends. Grey arrows: the user moves the chain ends.</tspan></text></g></svg>